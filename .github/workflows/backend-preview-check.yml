name: Check experimental cry-analysis backend

on:
  push:
    branches:
      - codex/mvp-native-integration
    paths:
      - "backend/**"
      - "Dockerfile"
      - ".github/workflows/backend-preview-check.yml"
  pull_request:
    paths:
      - "backend/**"
      - "Dockerfile"
      - ".github/workflows/backend-preview-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-checks:
    name: Validate uploaded audio format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run audio validation checks
        run: python -m unittest discover -s tests -v

  container-build:
    name: Build the CPU inference service image
    needs: unit-checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Build backend image
        run: docker build --tag baby-monitor-cry-analysis-preview ./backend

      - name: Build Railway root-context image
        run: docker build --file Dockerfile --tag baby-monitor-cry-analysis-railway .
