name: Android debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter SDK from the official repository
        shell: bash
        run: |
          set -euo pipefail
          flutter_dir="$RUNNER_TEMP/flutter"
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$flutter_dir"
          echo "$flutter_dir/bin" >> "$GITHUB_PATH"
          "$flutter_dir/bin/flutter" --version

      - name: Regenerate Android platform scaffold in CI
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          flutter create --platforms=android --project-name baby_monitor .

      - name: Ensure microphone permission
        shell: bash
        run: |
          set -euo pipefail
          manifest="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.RECORD_AUDIO' "$manifest"; then
            sed -i '/<application/i\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' "$manifest"
          fi

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: baby-monitor-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
