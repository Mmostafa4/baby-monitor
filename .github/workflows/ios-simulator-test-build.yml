name: Build iOS simulator test app

on:
  push:
    branches:
      - codex/mvp-native-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-simulator-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-simulator:
    name: Build iOS simulator app
    runs-on: macos-15
    timeout-minutes: 60
    env:
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      BABY_MONITOR_API_ENDPOINT: ${{ vars.BABY_MONITOR_API_ENDPOINT }}
      BABY_MONITOR_AI_ENDPOINT: ${{ vars.BABY_MONITOR_AI_ENDPOINT }}
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      FIREBASE_IOS_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure iOS permissions and deployment target
        run: python3 scripts/configure_ios.py

      - name: Resolve packages
        run: flutter pub get

      - name: Build unsigned iOS simulator app
        run: |
          dart_defines=()
          [[ -n "$BABY_MONITOR_API_ENDPOINT" ]] && dart_defines+=("--dart-define=BABY_MONITOR_API_ENDPOINT=$BABY_MONITOR_API_ENDPOINT")
          [[ -n "$BABY_MONITOR_AI_ENDPOINT" ]] && dart_defines+=("--dart-define=BABY_MONITOR_AI_ENDPOINT=$BABY_MONITOR_AI_ENDPOINT")
          [[ -n "$FIREBASE_API_KEY" ]] && dart_defines+=("--dart-define=FIREBASE_API_KEY=$FIREBASE_API_KEY")
          [[ -n "$FIREBASE_IOS_APP_ID" ]] && dart_defines+=("--dart-define=FIREBASE_IOS_APP_ID=$FIREBASE_IOS_APP_ID")
          [[ -n "$FIREBASE_MESSAGING_SENDER_ID" ]] && dart_defines+=("--dart-define=FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID")
          [[ -n "$FIREBASE_PROJECT_ID" ]] && dart_defines+=("--dart-define=FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID")
          flutter build ios --simulator --debug --no-codesign "${dart_defines[@]}"

      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app baby-monitor-ios-simulator.zip

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: baby-monitor-ios-simulator-${{ github.sha }}
          path: baby-monitor-ios-simulator.zip
          if-no-files-found: error
          retention-days: 30
