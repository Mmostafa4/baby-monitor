name: Build iOS simulator test app

on:
  push:
    branches:
      - codex/mvp-native-integration
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-simulator-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-simulator:
    name: Build iOS simulator app
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate a complete iOS project
        run: |
          scaffold_root="$RUNNER_TEMP/baby-monitor-ios-scaffold"
          icon_backup="$RUNNER_TEMP/baby-monitor-app-iconset"
          flutter create --no-pub --template app --platforms=ios --org com.example --project-name baby_monitor "$scaffold_root"
          cp -R ios/Runner/Assets.xcassets/AppIcon.appiconset "$icon_backup"
          rm -rf ios
          cp -R "$scaffold_root/ios" ios
          rm -rf ios/Runner/Assets.xcassets/AppIcon.appiconset
          cp -R "$icon_backup" ios/Runner/Assets.xcassets/AppIcon.appiconset
          python3 scripts/configure_ios.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios
          if ! git diff --cached --quiet; then
            git commit -m "build: generate complete iOS platform scaffold"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Resolve packages
        run: flutter pub get

      - name: Build unsigned iOS simulator app
        run: flutter build ios --simulator --debug --no-codesign

      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app baby-monitor-ios-simulator.zip

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: baby-monitor-ios-simulator-${{ github.sha }}
          path: baby-monitor-ios-simulator.zip
          if-no-files-found: error
          retention-days: 30
