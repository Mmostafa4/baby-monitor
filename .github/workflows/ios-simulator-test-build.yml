name: Build iOS simulator test app

on:
  push:
    branches:
      - codex/mvp-native-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-simulator-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-simulator:
    name: Build iOS simulator app
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Build unsigned iOS simulator app
        run: flutter build ios --simulator --debug --no-codesign

      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app baby-monitor-ios-simulator.zip

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: baby-monitor-ios-simulator-${{ github.sha }}
          path: baby-monitor-ios-simulator.zip
          if-no-files-found: error
          retention-days: 30
