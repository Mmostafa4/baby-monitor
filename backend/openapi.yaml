openapi: 3.0.3
info:
  title: Baby Monitor Experimental Cry Analysis API
  version: 0.1.0
  description: Closed-preview audio classification. Not diagnostic and not clinically validated.
paths:
  /v1/health:
    get:
      responses:
        '200':
          description: Model readiness
  /v1/cry-analysis:
    post:
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            encoding:
              audio:
                contentType: audio/wav
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
      responses:
        '200':
          description: Top-ranked experimental model category; no calibrated probability is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResult'
        '400': {description: Invalid WAV encoding or duration}
        '401': {description: Missing, invalid, or expired Firebase ID token}
        '413': {description: Audio exceeds the upload limit}
        '415': {description: Unsupported media type}
        '429': {description: Preview rate limit reached}
        '503': {description: Authentication or model is not available}
  /v1/newborn-assistant:
    post:
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantRequest'
      responses:
        '200':
          description: General Arabic newborn-care guidance from the configured text model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantResponse'
        '400': {description: Empty, invalid, or oversized question}
        '401': {description: Missing or invalid preview authentication}
        '429': {description: Preview or model-provider rate limit reached}
        '503': {description: Text-model service is not configured or unavailable}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    AnalysisResult:
      type: object
      required: [category, advice, score_percent, urgent, experimental]
      properties:
        category:
          type: string
          enum: [hungry, belly_pain, burping, discomfort, tiredness, unclear]
        advice: {type: string}
        urgent:
          type: boolean
          enum: [false]
        experimental:
          type: boolean
          enum: [true]
    AssistantRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
          minLength: 3
          maxLength: 900
    AssistantResponse:
      type: object
      required: [answer]
      properties:
        answer:
          type: string
